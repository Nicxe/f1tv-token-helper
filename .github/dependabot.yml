version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      extension-tooling:
        patterns:
          - "@eslint/*"
          - "@types/*"
          - "eslint"
          - "prettier"
          - "typescript"
          - "typescript-eslint"
          - "vitest"
      release-tooling:
        dependency-type: "development"
        patterns:
          - "@nicxe/semantic-release-config"
          - "@semantic-release/*"
          - "conventional-changelog-conventionalcommits"
          - "semantic-release"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      github-actions:
        patterns:
          - "*"
